<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you like...? 英文對話猜食物遊戲</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@500;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #FFFDE4 0%, #FFF194 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #4A4A4A;
            overflow-x: hidden;
        }

        h1 {
            color: #FF6B6B;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px #FFF;
            margin-bottom: 15px;
            text-align: center;
        }

        /* 句子大看板 */
        .sentence-box {
            background-color: #FFF;
            border: 4px solid #FFD166;
            border-radius: 20px;
            padding: 12px 25px;
            font-size: 1.4rem;
            font-weight: 600;
            color: #06D6A0;
            margin-bottom: 20px;
            box-shadow: 0 6px 0px #FFD166;
            text-align: center;
        }
        .sentence-box span {
            color: #FF6B6B;
            border-bottom: 3px dashed #FF6B6B;
            padding: 0 10px;
        }

        /* 計分板 */
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .score-card {
            flex: 1;
            background: #FFF;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            border: 3px solid #DDD;
            transition: all 0.3s ease;
        }

        .score-card.player-a { border-color: #118AB2; background-color: #E8F1F5; }
        .score-card.player-b { border-color: #FF85A2; background-color: #FFEBF0; }

        .score-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .score-card.player-a .score-title { color: #118AB2; }
        .score-card.player-b .score-title { color: #FF85A2; }

        .score-value {
            font-size: 2.5rem;
            font-weight: 600;
        }

        /* 當前狀態提示牌 */
        .status-badge {
            background-color: #118AB2;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            text-align: center;
            max-width: 90%;
        }

        /* 心心次數顯示 */
        .chances-box {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            background: #FFF;
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #FFD166;
        }
        .heart {
            color: #FF6B6B;
            font-size: 1.4rem;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        /* 遊戲主區塊 */
        .game-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            justify-content: center;
            padding: 10px;
        }

        /* 食物卡片 */
        .food-card {
            background: white;
            border-radius: 20px;
            border: 4px solid #FFD166;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 0px #FFD166;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.3s;
            user-select: none;
        }

        .food-card:hover {
            transform: translateY(-2px);
        }

        .food-card:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0px #FFD166;
        }

        .food-img {
            font-size: 4rem;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .food-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #4A4A4A;
            text-transform: capitalize;
        }

        /* 遮罩狀態樣式 */
        .food-card.masked .food-img {
            filter: blur(0);
        }
        .food-card.masked .food-name {
            color: #9B5DE5;
        }

        /* 猜錯的樣式 */
        .food-card.wrong {
            opacity: 0.5;
            background-color: #F0F0F0;
            border-color: #CCC;
            box-shadow: 0 8px 0px #CCC;
            pointer-events: none;
        }
        .food-card.wrong .food-name {
            text-decoration: line-through;
        }

        /* 正確解答高亮 */
        .food-card.reveal-correct {
            border-color: #06D6A0;
            box-shadow: 0 8px 0px #06D6A0;
            background-color: #E6FBF7;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* 大對話框彈窗 */
        .bubble-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .bubble-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bubble-content {
            background: white;
            border: 6px solid #FFD166;
            border-radius: 30px;
            padding: 30px 50px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
        }
        .bubble-overlay.active .bubble-content {
            transform: scale(1);
        }

        .bubble-text {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .bubble-text.yes { color: #06D6A0; }
        .bubble-text.no { color: #FF6B6B; }
        .bubble-text.fail { color: #FF9F1C; }

        .bubble-subtext {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 20px;
        }

        .bubble-btn {
            background: #9B5DE5;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0 #7B3EBF;
            transition: all 0.1s;
        }
        .bubble-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #7B3EBF;
        }

        /* 紙屑畫布 */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <h1>🍎 Do you like...? 英文對話猜食物 🍇</h1>

    <div class="sentence-box">
        問：Do you like <span>food</span>? &nbsp;&nbsp;&nbsp;&nbsp; 答：Yes, I do. / No, I don't.
    </div>

    <!-- 計分板 -->
    <div class="scoreboard">
        <div class="score-card player-a" id="card-a">
            <div class="score-title">🏆 PLAYER A</div>
            <div class="score-value" id="score-a">0</div>
        </div>
        <div class="score-card player-b" id="card-b">
            <div class="score-title">🏆 PLAYER B</div>
            <div class="score-value" id="score-b">0</div>
        </div>
    </div>

    <!-- 步驟提示與剩餘次數 -->
    <div class="status-badge" id="status-text">載入中...</div>
    
    <div class="chances-box" id="chances-area" style="display: none;">
        <span>剩餘猜測機會：</span>
        <div id="hearts-container"></div>
    </div>

    <!-- 食物卡片區 -->
    <div class="game-container" id="game-grid"></div>

    <!-- 彈出對話框 -->
    <div class="bubble-overlay" id="overlay">
        <div class="bubble-content">
            <div class="bubble-text" id="overlay-text">Yes, I do! 🎉</div>
            <div class="bubble-subtext" id="overlay-subtext"></div>
            <button class="bubble-btn" id="overlay-btn" onclick="closeOverlay()">繼續遊戲</button>
        </div>
    </div>

    <!-- 繽紛紙屑畫布 -->
    <canvas id="confetti-canvas"></canvas>

    <script>
        // 食物資料清單
        const foods = [
            { id: 'apples', name: 'apples', icon: '🍎' },
            { id: 'bananas', name: 'bananas', icon: '🍌' },
            { id: 'oranges', name: 'oranges', icon: '🍊' },
            { id: 'watermelons', name: 'watermelons', icon: '🍉' },
            { id: 'hamburgers', name: 'hamburgers', icon: '🍔' },
            { id: 'hot_dogs', name: 'hot dogs', icon: '🌭' },
            { id: 'sandwiches', name: 'sandwiches', icon: '🥪' }
        ];

        // 遊戲狀態變數
        let scores = { A: 0, B: 0 };
        let currentChooser = 'B'; // 誰負責選最愛食物 (一開始B選，A猜)
        let currentGuesser = 'A'; // 誰負責猜
        let gameState = 'SETUP';  // SETUP (設定中) | GUESSING (猜測中) | ROUND_OVER (回合結束)
        let favoriteFood = null;
        let guessCount = 0;
        const MAX_GUESSES = 3;

        // 音效產生器 (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'correct') {
                // 輕快雙音節
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                // 答錯嗶嗶聲
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'fail') {
                // 機會用盡低沈沮喪音
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // 初始化渲染食物卡片
        const grid = document.getElementById('game-grid');
        function initGrid() {
            grid.innerHTML = '';
            foods.forEach(food => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.id = `card-${food.id}`;
                card.innerHTML = `
                    <div class="food-img">${food.icon}</div>
                    <div class="food-name">${food.name}</div>
                `;
                card.onclick = () => handleCardClick(food);
                grid.appendChild(card);
            });
        }

        // 重新整理介面外觀
        function updateUI() {
            const statusBadge = document.getElementById('status-text');
            const chancesArea = document.getElementById('chances-area');
            const heartsContainer = document.getElementById('hearts-container');
            
            // 亮起目前操作者的分數看板
            document.getElementById('card-a').style.transform = currentGuesser === 'A' && gameState === 'GUESSING' ? 'scale(1.05)' : 'scale(1)';
            document.getElementById('card-b').style.transform = currentGuesser === 'B' && gameState === 'GUESSING' ? 'scale(1.05)' : 'scale(1)';

            if (gameState === 'SETUP') {
                statusBadge.textContent = `👀 步驟 1：請 Player ${currentGuesser} 閉上眼睛！Player ${currentChooser} 偷偷點選「我最喜歡的食物」`;
                statusBadge.style.backgroundColor = '#9B5DE5';
                chancesArea.style.display = 'none';
                
                // 還原所有卡片為正常顯示狀態讓出題者選
                foods.forEach(f => {
                    const card = document.getElementById(`card-${f.id}`);
                    card.className = 'food-card';
                    card.querySelector('.food-img').textContent = f.icon;
                });
            } else if (gameState === 'GUESSING') {
                statusBadge.textContent = `🗣️ 步驟 2：Player ${currentGuesser} 睜開眼，用英文問問題並點擊按鈕猜測！`;
                statusBadge.style.backgroundColor = currentGuesser === 'A' ? '#118AB2' : '#FF85A2';
                chancesArea.style.display = 'flex';
                
                // 渲染剩餘愛心
                heartsContainer.innerHTML = '';
                for(let i = 0; i < MAX_GUESSES; i++) {
                    const heart = document.createElement('span');
                    heart.className = 'heart';
                    heart.textContent = i < (MAX_GUESSES - guessCount) ? '❤️' : '🖤';
                    heartsContainer.appendChild(heart);
                }
            }
        }

        // 處理食物點擊
        function handleCardClick(food) {
            if (gameState === 'ROUND_OVER') return;

            if (gameState === 'SETUP') {
                // 階段一：設定最愛食物
                playSound('click');
                favoriteFood = food;
                gameState = 'GUESSING';
                guessCount = 0;
                
                // 變身為神祕遮罩卡片
                foods.forEach(f => {
                    const card = document.getElementById(`card-${f.id}`);
                    card.classList.add('masked');
                    card.querySelector('.food-img').textContent = '❓';
                });
                updateUI();
            } else if (gameState === 'GUESSING') {
                // 階段二：猜測食物
                const card = document.getElementById(`card-${food.id}`);
                
                // 防止點選到已經猜錯的
                if (card.classList.contains('wrong')) return;

                guessCount++;
                
                if (food.id === favoriteFood.id) {
                    // 【猜對了！】
                    playSound('correct');
                    gameState = 'ROUND_OVER';
                    
                    // 加分
                    scores[currentGuesser]++;
                    document.getElementById(`score-${currentGuesser.toLowerCase()}`).textContent = scores[currentGuesser];

                    // 翻牌顯示正確答案
                    card.className = 'food-card reveal-correct';
                    card.querySelector('.food-img').textContent = food.icon;

                    // 彈出成功視窗與放紙屑
                    showOverlay('yes', `Yes, I do! 🎉`, `太棒了！Player ${currentGuesser} 在第 ${guessCount} 次猜對了 ${food.name}！<br><b style="color:#06D6A0;">獲得 1 分！</b>`);
                    startConfetti();
                } else {
                    // 【猜錯了】
                    card.classList.remove('masked');
                    card.classList.add('wrong');
                    card.querySelector('.food-img').textContent = '❌';

                    if (guessCount >= MAX_GUESSES) {
                        // 【3次機會用盡！】
                        playSound('fail');
                        gameState = 'ROUND_OVER';
                        
                        // 揭曉正確答案
                        const correctCard = document.getElementById(`card-${favoriteFood.id}`);
                        correctCard.className = 'food-card reveal-correct';
                        correctCard.querySelector('.food-img').textContent = favoriteFood.icon;

                        showOverlay('fail', `No, I don't. 💔`, `3次機會都用完囉！<br>正確答案是：<b>${favoriteFood.name} ${favoriteFood.icon}</b><br><span style="color:#FF6B6B;">這次沒有得到分數。</span>`);
                    } else {
                        // 【只是猜錯，還有機會】
                        playSound('wrong');
                        showOverlay('no', `No, I don't.`, `猜錯囉！再接再厲！<br>英文句型複習：Do you like ${food.name}?`);
                    }
                }
                updateUI();
            }
        }

        // 彈出視窗控制
        function showOverlay(styleClass, title, htmlText) {
            const overlay = document.getElementById('overlay');
            const textEl = document.getElementById('overlay-text');
            const subtextEl = document.getElementById('overlay-subtext');
            const btnEl = document.getElementById('overlay-btn');

            textEl.className = `bubble-text ${styleClass}`;
            textEl.innerHTML = title;
            subtextEl.innerHTML = htmlText;
            
            if (gameState === 'ROUND_OVER') {
                btnEl.textContent = `下一回合！換下一位同學`;
            } else {
                btnEl.textContent = `繼續猜測 (${guessCount}/${MAX_GUESSES})`;
            }

            overlay.classList.add('active');
        }

        function closeOverlay() {
            playSound('click');
            document.getElementById('overlay').classList.remove('active');
            stopConfetti();

            if (gameState === 'ROUND_OVER') {
                // 輪流切換身分
                if (currentGuesser === 'A') {
                    currentGuesser = 'B';
                    currentChooser = 'A';
                } else {
                    currentGuesser = 'A';
                    currentChooser = 'B';
                }
                gameState = 'SETUP';
                favoriteFood = null;
                guessCount = 0;
                initGrid();
                updateUI();
            }
        }

        // ==========================================
        // 繽紛彩色紙屑特效繪製邏輯 (Canvas Confetti)
        // ==========================================
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confetti = [];
        let confettiAnimationId = null;
        const colors = ['#FF6B6B', '#FFD166', '#06D6A0', '#118AB2', '#9B5DE5', '#FF85A2'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfettiPiece() {
            return {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 6 + 4,
                d: Math.random() * canvas.height,
                color: colors[Math.floor(Math.random() * colors.length)],
                tilt: Math.random() * 10 - 5,
                tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                tiltAngle: 0
            };
        }

        function drawConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confetti.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleIncremental;
                p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle);
                p.tilt = Math.sin(p.tiltAngle - index / 3) * 15;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                ctx.stroke();

                if (p.y > canvas.height) {
                    confetti[index] = createConfettiPiece();
                    confetti[index].y = -10;
                }
            });
            confettiAnimationId = requestAnimationFrame(drawConfetti);
        }

        function startConfetti() {
            confetti = [];
            for (let i = 0; i < 150; i++) {
                confetti.push(createConfettiPiece());
            }
            if(!confettiAnimationId) drawConfetti();
        }

        function stopConfetti() {
            if(confettiAnimationId) {
                cancelAnimationFrame(confettiAnimationId);
                confettiAnimationId = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // 開機初始化
        initGrid();
        updateUI();
    </script>
</body>
</html>
